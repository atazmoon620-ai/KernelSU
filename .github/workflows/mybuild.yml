name: mybuild
on:
  workflow_dispatch:
jobs:
  lkm:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kmi: [android12-5.10, android13-5.10, android13-5.15, android14-5.15, android14-6.1, android15-6.6, android16-6.12]
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-20260828
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - run: |
          cd kernel
          make -C "$KDIR" M="$PWD" ARCH=arm64 LLVM=1 -j$(nproc) modules || true
          K=$(find . -name '*.ko' | head -1); echo "FOUND=$K"
          mkdir -p /tmp/o
          [ -n "$K" ] && cp "$K" /tmp/o/kernelsu-${{ matrix.kmi }}.ko
          ls -la /tmp/o
      - uses: actions/upload-artifact@v4
        with: { name: lkm-${{ matrix.kmi }}, path: /tmp/o/*.ko, if-no-files-found: warn }

  apk:
    needs: lkm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }
      - run: |
          sdkmanager "platform-tools" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "ndk;27.2.12479018" || true
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV
      - uses: actions/download-artifact@v4
        with: { pattern: 'lkm-*', merge-multiple: true, path: lkmko }
      - run: |
          mkdir -p manager/app/src/main/assets/lkm manager/app/src/main/jniLibs/arm64-v8a
          cp lkmko/*.ko manager/app/src/main/assets/lkm/ || true
          cp lkmko/*.ko manager/app/src/main/assets/ || true
          cp lkmko/*.ko manager/app/src/main/jniLibs/arm64-v8a/ || true
          cp lkmko/kernelsu-android12-5.10.ko manager/app/src/main/assets/kernelsu.ko || true
          ls manager/app/src/main/assets/
      - run: |
          echo "${{ secrets.KEYSTORE }}" | base64 -d > keystore.jks
          printf 'KEYSTORE_FILE=../keystore.jks\nKEYSTORE_PASSWORD=%s\nKEY_ALIAS=%s\nKEY_PASSWORD=%s\n' \
            "${{ secrets.KEYSTORE_PASSWORD }}" "${{ secrets.KEY_ALIAS }}" "${{ secrets.KEY_PASSWORD }}" > signing.properties
      - name: ksud
        continue-on-error: true
        env: { KSU_PACKAGE_NAME: com.chess }
        run: |
          export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          export CC_aarch64_linux_android=aarch64-linux-android24-clang
          export AR_aarch64_linux_android=llvm-ar
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=aarch64-linux-android24-clang
          cargo build --release --target aarch64-linux-android -p ksud
          cp target/aarch64-linux-android/release/ksud manager/app/src/main/jniLibs/arm64-v8a/libksud.so
      - name: apk
        env: { KSU_PACKAGE_NAME: com.chess }
        run: |
          ./gradlew :manager:app:assembleRelease --no-daemon || ./gradlew assembleRelease --no-daemon
          find . -path '*outputs/apk*' -name '*.apk'
      - name: sign + verify
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          A=$(find . -path '*outputs/apk*' -name '*.apk' | head -1)
          $BT/zipalign -p -f 4 "$A" aligned.apk
          $BT/apksigner sign --ks keystore.jks --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass pass:"${{ secrets.KEY_PASSWORD }}" --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --out Chess.apk aligned.apk
          $BT/apksigner verify --print-certs Chess.apk
          KH=$(grep -oE '[0-9a-f]{64}' kernel/Makefile | head -1)
          AH=$($BT/apksigner verify --print-certs Chess.apk | grep -oiE '[0-9a-f]{64}' | head -1)
          echo "kernel=$KH apk=$AH"
          [ "$KH" = "$AH" ] && echo "HASH MATCH OK" || { echo "HASH MISMATCH"; exit 1; }
      - uses: actions/upload-artifact@v4
        with: { name: Chess, path: Chess.apk }
      - uses: actions/upload-artifact@v4
        with: { name: lkm-all, path: lkmko/*.ko }
